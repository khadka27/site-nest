# ==============================================================================
# SiteNest Production Nginx Configuration
# ==============================================================================
# 1. Main Platform: sitenest.com & admin.sitenest.com -> Next.js Application
# 2. Uploaded Websites: *.sitenest.com / *.sitenestusercontent.com -> Static Files
# ==============================================================================

# Gzip Compression settings
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

# Upstream Next.js application
upstream nextjs_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

# ------------------------------------------------------------------------------
# 1. Main Control Panel & Platform (sitenest.com, www.sitenest.com)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name sitenest.com www.sitenest.com admin.sitenest.com;

    # For Let's Encrypt HTTP-01 verification (if not using DNS-01)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect HTTP to HTTPS in production
    # return 301 https://$host$request_uri;

    # Proxy all traffic to Next.js App
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Upload size limit for ZIP files (50MB)
        client_max_body_size 50M;
    }
}

# ------------------------------------------------------------------------------
# 2. Wildcard Static Websites (*.sitenest.com, *.sitenestusercontent.com)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ~^(?<subdomain>[a-zA-Z0-9-]+)\.sitenest\.(com|local)$;

    # Protect against accessing platform roots via wildcard regex
    if ($subdomain ~* "^(www|admin|api|mail|ftp|app)$") {
        return 301 http://sitenest.com$request_uri;
    }

    # Isolated release directory path
    # In production: /var/www/sitenest/storage/websites/$subdomain/current
    # Fallback to local storage path
    root /var/www/sitenest/storage/websites/$subdomain/current;
    index index.html;

    # Security Headers for untrusted user-uploaded HTML/JS
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https:;" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Served-By "SiteNest-Nginx-Edge" always;

    # Caching for static assets (CSS, JS, Images, Fonts)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Route clean URLs: /about -> /about.html -> directory -> index.html
    location / {
        try_files $uri $uri.html $uri/ /index.html =404;
    }

    # Custom 404 handler
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
